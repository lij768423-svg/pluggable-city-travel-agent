<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>杭州行程 · 匿名方案对照</title>
<style>body{margin:0;background:#f5f6f8;color:#253349;font:16px/1.6 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:30px 24px}h1{font-size:30px;letter-spacing:-1px}h2{font-size:22px}button,select,input{font:inherit;padding:9px 12px;border:1px solid #bcc9da;border-radius:8px;background:white;color:inherit}button{cursor:pointer;color:#24558c}section{margin:28px 0;padding:20px;background:white;border:1px solid #e0e5ec;border-radius:12px}.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.plan{min-width:0}.item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid #edf0f4}.item span{overflow-wrap:anywhere}small{color:#657389}fieldset{border:0;padding:12px 0}legend{font-weight:600}label{display:inline-flex;gap:6px;align-items:center;margin:6px 16px 6px 0}textarea{display:block;width:100%;box-sizing:border-box;min-height:80px;font:inherit;padding:10px;border:1px solid #bcc9da;border-radius:8px}.notice{max-width:900px;color:#58677b}#status{color:#24558c}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left}a{color:#24558c}@media(max-width:680px){main{padding:20px 14px}.pair{grid-template-columns:1fr}.plan{border-top:2px solid #d4dfea}.item{grid-template-columns:90px minmax(0,1fr)}section{padding:14px}h1{font-size:26px}}</style>
<main><p>杭州行记 · 研究问卷</p><h1>哪一份行程，你更愿意照着走？</h1><p class="notice">自愿参与，不收集姓名、联系方式或账号。约需10–15分钟。每组的两份方案基于同一需求；请独立比较地点、行程与餐饮，不猜测生成方法。这里使用固定的研究数据与估算交通，仅供方案评估，不是实时导航。未评分不会被当作平票。回答只保留在本页内存，点击导出后由你决定是否交给研究者。</p><label>参与代码 <select id="participant"><option value="">请选择研究者分配的代码</option></select></label><label><input type="checkbox" id="consent">我了解研究用途并自愿参与</label><button id="start">载入方案</button><p id="status" role="status"></p><form id="review"><div id="pairs"></div><button id="download" hidden>完成并导出匿名回答</button></form><p class="notice">不确定可以选择“相当”或“两份都不想采用”。页面不会发送网络请求。关闭页面前请导出答案。</p></main>
<script>
const data=__PAYLOAD__;
const selector=document.querySelector('#participant'),container=document.querySelector('#pairs'),status=document.querySelector('#status');
let activeCode='';
const escapeText=value=>String(value).replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const hm=value=>`${String(Math.floor(value/60)).padStart(2,'0')}:${String(value%60).padStart(2,'0')}`;
Object.keys(data.packets).forEach(code=>selector.add(new Option(code,code)));
function itinerary(days){return days.map(day=>`<h3>第 ${day.day} 天</h3>${day.items.map(item=>`<div class="item"><small>${hm(item.start)}–${hm(item.end)}</small><span>${escapeText(item.name)}<br><small>${escapeText(item.travel_mode)}约${item.travel_min}分钟 · ${item.kind==='meal'?'餐费':'门票'}参考 ¥${item.cost}</small></span></div>`).join('')}<small>返回起点约${day.return_travel_min}分钟</small>`).join('')}
document.querySelector('#start').onclick=()=>{if(!selector.value||!document.querySelector('#consent').checked){status.textContent='请选择参与代码并确认知情同意。';return}if(activeCode&& !confirm('切换代码会清空当前未导出的答案，继续吗？'))return;activeCode=selector.value;container.innerHTML=data.packets[activeCode].map((pair,index)=>`<section data-pair="${pair.pair}"><h2>第 ${index+1} 组 · ${escapeText(pair.label)}</h2><p>出发日期：${escapeText(pair.profile.start_date)} · 兴趣：${pair.profile.interests.map(escapeText).join('、')} · 人均总预算 ¥${pair.profile.budget} · 每日09:00–20:30 · ${pair.profile.pace==='relaxed'?'轻松节奏':'适中节奏'} · 起点：${escapeText(pair.profile.hotel.name)} · 每日步行上限${pair.profile.max_walking_m}米</p><p>必去：${pair.profile.must_visit.map(escapeText).join('、')||'无'}；饮食禁忌：${pair.profile.dietary.map(escapeText).join('、')||'无'}。含晚间活动，交通以打车与短距离步行为主。</p><div class="pair"><div class="plan"><h3>方案 A</h3>${itinerary(pair.left)}</div><div class="plan"><h3>方案 B</h3>${itinerary(pair.right)}</div></div><h3>分别评分（1差，5好）</h3><table><tr><th>维度</th><th>方案 A</th><th>方案 B</th></tr>${[['fit','符合需求'],['route','路线与节奏'],['meals','餐饮合理性']].map(([metric,label])=>`<tr><td>${label}</td>${['left','right'].map(side=>`<td><select required aria-label="第${index+1}组${label}方案${side==='left'?'A':'B'}" name="${pair.pair}-${metric}-${side}"><option value="">请选择</option>${[1,2,3,4,5].map(score=>`<option>${score}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</table><fieldset><legend>如果实际出游，你会采用哪份？</legend>${[['left','方案 A'],['right','方案 B'],['tie','两份相当'],['neither','两份都不想采用']].map(([value,label])=>`<label><input required type="radio" name="${pair.pair}-choice" value="${value}">${label}</label>`).join('')}</fieldset><label for="comment-${pair.pair}">原因或不合理之处（可不填）</label><textarea maxlength="1200" id="comment-${pair.pair}" name="${pair.pair}-comment"></textarea></section>`).join('');document.querySelector('#download').hidden=false;status.textContent='已载入3组，请逐组评价后导出。'};
document.querySelector('#review').onsubmit=event=>{event.preventDefault();if(!activeCode||!document.querySelector('#consent').checked){status.textContent='请确认知情同意。';return}const form=new FormData(event.target);const answers=data.packets[activeCode].map(pair=>({pair:pair.pair,choice:form.get(`${pair.pair}-choice`),comment:form.get(`${pair.pair}-comment`),...Object.fromEntries(['fit','route','meals'].map(metric=>[metric,Object.fromEntries(['left','right'].map(side=>[side,Number(form.get(`${pair.pair}-${metric}-${side}`))]))]))}));const blob=new Blob([JSON.stringify({version:1,experiment:data.experiment,participant:activeCode,consent:true,answers},null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`hangzhou-blind-${activeCode}.json`;link.click();URL.revokeObjectURL(link.href);status.textContent='已导出匿名回答，请按研究者的收集方式提交。'};
</script></html>
